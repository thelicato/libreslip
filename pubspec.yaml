name: libreslip
description: A private, local order-ticket printing workspace for Android.
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image: ^4.10.1
  image_picker: ^1.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.13.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2

  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Roboto-LICENSE.txt
  fonts:
    - family: RobotoTicket
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
